databases:
  - name: cleanflow-db
    plan: free
    region: frankfurt

services:
  - type: web
    name: cleanflow-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: pnpm --filter @cleanflow/server db:migrate && pnpm --filter @cleanflow/server start
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: cleanflow-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: ACCESS_TOKEN_SECRET
        generateValue: true
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: AUTH_COOKIE_SAMESITE
        value: none
      # После первого деплоя узнаешь реальный URL cleanflow-client (шаг 3 в
      # инструкции) и пропишешь его сюда вручную в Render Dashboard.
      - key: CORS_ORIGIN
        value: ""

  - type: web
    name: cleanflow-client
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @cleanflow/client build
    staticPublishPath: client/dist
    envVars:
      # После первого деплоя узнаешь реальный URL cleanflow-api и пропишешь
      # его сюда (с /api/v1 на конце), затем передеплоишь этот сервис.
      - key: VITE_API_URL
        value: ""
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
